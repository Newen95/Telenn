[package]
name = "telenn"
version = "0.1.0"
description = "Telenn — modular cross-platform DAW"
authors = ["Newen <newen.calle@gmail.com>"]
edition = "2021"
# The verification CLIs add extra [[bin]] targets; keep `cargo run` (and
# therefore `tauri dev`) pointing at the app.
default-run = "telenn"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "telenn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Offline verification CLIs (the agent's "ears") — see CONTRIBUTING.md.
[[bin]]
name = "analyze_wav"
path = "tools/analyze_wav.rs"

[[bin]]
name = "render_probe"
path = "tools/render_probe.rs"

[[bin]]
name = "song_lint"
path = "tools/song_lint.rs"

[[bin]]
name = "module_specs"
path = "tools/module_specs.rs"

[[bin]]
name = "reference_match"
path = "tools/reference_match.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
rtrb = "0.3.4"
hound = "3.5.1"
thiserror = "2.0.18"
notify = "8.2.0"
midir = "0.11.0"

